<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#17110c">
    <title>三国杀酒馆 · 图鉴</title>
    <link rel="stylesheet" href="css/sgs.css?v=20261017a">
    <link rel="stylesheet" href="css/pages.css?v=20261017a">
    <!-- 主题脚本放在 head：先于页面渲染应用暖纸/夜墨，避免闪烁 -->
    <script src="js/card_info.js?v=20261017a"></script>
    <script src="js/sgs_common.js?v=20261017a"></script>
</head>
<body>
<div class="page">
    <header class="topbar">
        <a class="logo" href="index.html" aria-label="返回大厅">
            <span class="logo-seal">杀</span>
            <span class="logo-text gold-text">三国杀酒馆</span>
        </a>
        <nav aria-label="主导航">
            <a href="index.html">大厅</a>
            <a href="handbook.html" aria-current="page">图鉴</a>
            <a href="settings.html">设置</a>
            <button class="icon-btn" type="button" data-theme-toggle aria-label="切换主题"></button>
        </nav>
    </header>

    <main>
        <div class="hb-tabs" role="tablist" aria-label="图鉴分类">
            <button role="tab" type="button" id="tabCards" aria-selected="true" aria-controls="paneCards">卡牌</button>
            <button role="tab" type="button" id="tabHeroes" aria-selected="false" aria-controls="paneHeroes">武将</button>
        </div>
        <section id="paneCards" role="tabpanel" aria-labelledby="tabCards"></section>
        <section id="paneHeroes" role="tabpanel" aria-labelledby="tabHeroes" hidden>
            <div class="hb-filter">
                <input class="input" id="heroSearch" placeholder="搜索武将或技能" aria-label="搜索武将或技能">
                <div class="faction-tabs" id="heroFaction" role="group" aria-label="按势力筛选">
                    <button type="button" class="all" data-faction="" aria-pressed="true">全部</button>
                    <button type="button" data-faction="魏" aria-pressed="false"><span class="seal faction faction-魏">魏</span>魏</button>
                    <button type="button" data-faction="蜀" aria-pressed="false"><span class="seal faction faction-蜀">蜀</span>蜀</button>
                    <button type="button" data-faction="吴" aria-pressed="false"><span class="seal faction faction-吴">吴</span>吴</button>
                    <button type="button" data-faction="群" aria-pressed="false"><span class="seal faction faction-群">群</span>群</button>
                </div>
            </div>
            <div class="hb-heroes" id="heroList"><p class="muted">正在读取武将…</p></div>
        </section>
    </main>
</div>

<script src="js/protocol.js?v=20261017a"></script>
<script src="js/global_settings.js?v=20261017a"></script>
<script src="js/handbook.js?v=20261017a"></script>
</body>
</html>
