<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#17110c">
    <title>三国杀酒馆 · 选将</title>
    <link rel="icon" type="image/png" href="assets/favicon.png">
    <link rel="stylesheet" href="css/sgs.css?v=20261023u2">
    <link rel="stylesheet" href="css/pages.css?v=20261017e">
    <!-- 主题脚本放在 head：先于页面渲染应用暖纸/夜墨，避免闪烁 -->
    <script src="js/card_info.js?v=20261017e"></script>
    <script src="js/sgs_common.js?v=20261023u2"></script>
    <script src="js/local_skins.js?v=20261020f1"></script>
</head>
<body>
<div class="page">
    <header class="topbar">
        <a class="logo" href="index.html" aria-label="返回大厅">
            <span class="logo-seal">杀</span>
            <span class="logo-text gold-text">三国杀酒馆</span>
        </a>
        <nav aria-label="主导航">
            <a href="index.html">返回大厅</a>
            <a href="handbook.html">图鉴</a>
            <button class="icon-btn" type="button" data-theme-toggle aria-label="切换主题"></button>
        </nav>
    </header>

    <main>
        <div class="pick-head">
            <h1 class="brush gold-text">点将</h1>
            <div class="faction-tabs" role="group" aria-label="按势力筛选" id="factionTabs">
                <button type="button" class="all" data-faction="" aria-pressed="true">全部</button>
                <button type="button" data-faction="魏" aria-pressed="false"><span class="seal faction faction-魏">魏</span>魏</button>
                <button type="button" data-faction="蜀" aria-pressed="false"><span class="seal faction faction-蜀">蜀</span>蜀</button>
                <button type="button" data-faction="吴" aria-pressed="false"><span class="seal faction faction-吴">吴</span>吴</button>
                <button type="button" data-faction="群" aria-pressed="false"><span class="seal faction faction-群">群</span>群</button>
            </div>
        </div>

        <div class="pick-layout">
            <div>
                <div class="hero-grid" id="heroGrid" aria-label="武将列表">
                    <div class="empty-pick" id="loadingMessage">正在召集武将…</div>
                </div>
            </div>
            <aside class="frame cornered hero-detail" id="heroDetail" aria-live="polite">
                <div class="empty-pick">从左侧选一位武将，<br>这里会显示他的技能。</div>
            </aside>
        </div>
    </main>
</div>

<script src="js/protocol.js?v=20261017e"></script>
<script src="js/global_settings.js?v=20261023u2"></script>
<script src="js/select_hero.js?v=20261017e"></script>
</body>
</html>
