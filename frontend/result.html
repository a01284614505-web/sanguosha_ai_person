<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#17110c">
    <title>三国杀酒馆 · 战绩</title>
    <link rel="icon" type="image/png" href="assets/favicon.png">
    <link rel="stylesheet" href="css/sgs.css?v=20261017e">
    <link rel="stylesheet" href="css/pages.css?v=20261020f3">
    <!-- 主题脚本放在 head：先于页面渲染应用暖纸/夜墨，避免闪烁 -->
    <script src="js/card_info.js?v=20261017e"></script>
    <script src="js/sgs_common.js?v=20261020f3"></script>
    <script src="js/local_skins.js?v=20261020f1"></script>
</head>
<body>
<div class="page">
    <header class="topbar">
        <a class="logo" href="index.html" aria-label="返回大厅">
            <span class="logo-seal">杀</span>
            <span class="logo-text gold-text">三国杀酒馆</span>
        </a>
        <nav aria-label="主导航">
            <a href="index.html">大厅</a>
            <a href="history.html">历史</a>
            <a href="logs.html">日志</a>
            <a href="handbook.html">图鉴</a>
            <a href="settings.html">设置</a>
            <button class="icon-btn" type="button" data-theme-toggle aria-label="切换主题"></button>
        </nav>
    </header>

    <main id="resultMain">
        <section class="result-hero">
            <div class="verdict neutral" id="resultVerdict">终</div>
            <h1 class="brush gold-text" id="resultTitle">对局结束</h1>
            <p id="resultSubtitle"></p>
        </section>

        <div class="result-facts">
            <div>轮数<b id="totalRounds">-</b></div>
            <div>用时<b id="gameDuration">-</b></div>
            <div><span id="yourIdentityLabel">你的身份</span><b id="yourIdentity">-</b></div>
        </div>
        <p class="record-line" id="profileSummary" hidden></p>
        <p class="muted" id="historySaveError" hidden></p>

        <div class="result-grid">
            <aside class="frame cornered mvp-card" id="mvpCard" hidden>
                <span class="mvp-badge">MVP</span>
                <div id="mvpInfo"></div>
            </aside>
            <section class="frame" style="padding:16px 18px">
                <h2 class="section-title">本局战况</h2>
                <div class="table-wrap" id="statsList"></div>
            </section>
        </div>

        <div class="frame reward-note" id="rewardSection" hidden>
            <div id="rewardCard"></div>
            <div><b class="brush gold-text">意外之喜</b><p>获得一张身份卡。下局开局前，可在大厅用它指定自己的身份。</p></div>
        </div>

        <div class="result-actions">
            <button class="btn primary big" id="playAgainBtn" type="button">再来一局</button>
            <button class="btn" id="backToLobbyBtn" type="button">返回大厅</button>
            <a class="btn" href="history.html" style="text-decoration:none">历史战绩</a>
            <a class="btn" id="viewLogBtn" href="logs.html" style="text-decoration:none">本局日志</a>
        </div>
    </main>
</div>

<script src="js/protocol.js?v=20261017e"></script>
<script src="js/global_settings.js?v=20261020f6"></script>
<script src="js/result.js?v=20261020f3"></script>
</body>
</html>
