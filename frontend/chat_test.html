<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AI聊天测试 - 三国杀酒馆</title>
    <link rel="stylesheet" href="css/main.css">
    <style>
        .chat-test-container {
            max-width: 800px;
            margin: 40px auto;
            padding: 20px;
        }

        .test-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .test-header h1 {
            font-size: 36px;
            background: linear-gradient(135deg, var(--shu-red) 0%, var(--gold) 50%, var(--wu-green) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 10px;
        }

        .api-config-panel {
            background: var(--bg-card);
            border: 2px solid var(--border-gold);
            border-radius: 12px;
            padding: 24px;
            margin-bottom: 24px;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.5);
        }

        .config-title {
            font-size: 18px;
            color: var(--text-gold);
            margin-bottom: 16px;
            border-bottom: 2px solid var(--border-gold);
            padding-bottom: 8px;
        }

        .config-row {
            display: grid;
            grid-template-columns: 120px 1fr;
            gap: 12px;
            margin-bottom: 12px;
            align-items: center;
        }

        .config-label {
            color: var(--text-muted);
            font-size: 14px;
        }

        .config-input, .config-select {
            padding: 10px 14px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            background: rgba(10, 10, 10, 0.5);
            color: var(--text-light);
            font-size: 14px;
            transition: all 0.3s;
        }

        .config-input:focus, .config-select:focus {
            outline: none;
            border-color: var(--border-gold);
            box-shadow: 0 0 8px rgba(212, 175, 55, 0.3);
        }

        .chat-box {
            background: var(--bg-card);
            border: 2px solid var(--shu-red);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
            height: 400px;
            overflow-y: auto;
            box-shadow: 0 4px 16px rgba(196, 30, 58, 0.3);
        }

        .chat-message {
            margin-bottom: 16px;
            padding: 12px;
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.05);
        }

        .chat-message.user {
            background: rgba(74, 124, 94, 0.2);
            border-left: 3px solid var(--wu-green);
        }

        .chat-message.ai {
            background: rgba(196, 30, 58, 0.2);
            border-left: 3px solid var(--shu-red);
        }

        .chat-message.system {
            background: rgba(138, 122, 106, 0.2);
            border-left: 3px solid var(--text-muted);
        }

        .message-sender {
            font-weight: bold;
            margin-bottom: 6px;
            font-size: 14px;
        }

        .message-sender.user {
            color: var(--wu-green);
        }

        .message-sender.ai {
            color: var(--shu-red);
        }

        .message-sender.system {
            color: var(--text-muted);
        }

        .message-text {
            color: var(--text-light);
            line-height: 1.6;
        }

        .chat-input-area {
            display: flex;
            gap: 12px;
        }

        .chat-input {
            flex: 1;
            padding: 12px 16px;
            border: 2px solid var(--border-gold);
            border-radius: 8px;
            background: rgba(10, 10, 10, 0.5);
            color: var(--text-light);
            font-size: 15px;
        }

        .send-btn {
            padding: 12px 32px;
            background: linear-gradient(135deg, var(--shu-red) 0%, var(--primary-red) 100%);
            border: 2px solid var(--shu-red);
            color: var(--text-light);
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s;
        }

        .send-btn:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 4px 16px rgba(196, 30, 58, 0.5);
        }

        .send-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .status-indicator {
            text-align: center;
            padding: 8px;
            margin-top: 12px;
            border-radius: 6px;
            font-size: 13px;
        }

        .status-indicator.ready {
            background: rgba(74, 124, 94, 0.2);
            color: var(--wu-green);
        }

        .status-indicator.error {
            background: rgba(196, 30, 58, 0.2);
            color: var(--shu-red);
        }

        .status-indicator.loading {
            background: rgba(212, 175, 55, 0.2);
            color: var(--gold);
        }
    </style>
</head>
<body>
    <div class="chat-test-container">
        <div class="test-header">
            <h1>⚔️ AI聊天测试</h1>
            <p style="color: var(--text-muted);">配置你的AI并开始对话</p>
        </div>

        <div class="api-config-panel">
            <div class="config-title">🤖 AI配置</div>
            
            <div class="config-row">
                <label class="config-label">AI Provider:</label>
                <select id="provider" class="config-select">
                    <option value="deepseek">DeepSeek（推荐）</option>
                    <option value="qwen">通义千问</option>
                    <option value="openai">OpenAI</option>
                    <option value="gemini">Gemini</option>
                    <option value="claude">Claude</option>
                    <option value="glm">智谱GLM</option>
                    <option value="grok">Grok</option>
                    <option value="doubao">豆包</option>
                </select>
            </div>

            <div class="config-row">
                <label class="config-label">API地址:</label>
                <input type="text" id="apiUrl" class="config-input" placeholder="API endpoint" value="https://api.deepseek.com/v1">
            </div>

            <div class="config-row">
                <label class="config-label">API Key:</label>
                <input type="password" id="apiKey" class="config-input" placeholder="sk-...">
            </div>

            <div class="config-row">
                <label class="config-label">模型名称:</label>
                <input type="text" id="model" class="config-input" placeholder="模型名称" value="deepseek-chat">
            </div>

            <div class="config-row">
                <label class="config-label">温度:</label>
                <input type="number" id="temperature" class="config-input" value="0.8" min="0" max="2" step="0.1">
            </div>

            <div class="config-row">
                <label class="config-label">AI角色:</label>
                <input type="text" id="aiName" class="config-input" value="诸葛亮" placeholder="AI的名字">
            </div>

            <div id="statusIndicator" class="status-indicator" style="display: none;"></div>
        </div>

        <div class="chat-box" id="chatBox">
            <div class="chat-message system">
                <div class="message-sender system">系统</div>
                <div class="message-text">欢迎来到AI三国杀酒馆！请先配置你的AI API，然后开始聊天测试。</div>
            </div>
        </div>

        <div class="chat-input-area">
            <input type="text" id="userInput" class="chat-input" placeholder="输入消息..." />
            <button id="sendBtn" class="send-btn">发送</button>
        </div>

        <div style="text-align: center; margin-top: 20px;">
            <a href="index.html" style="color: var(--text-muted); text-decoration: none;">← 返回大厅</a>
        </div>
    </div>

    <script>
        // Provider配置
        const providerConfigs = {
            deepseek: { url: 'https://api.deepseek.com/v1', model: 'deepseek-chat' },
            qwen: { url: 'https://dashscope.aliyuncs.com/compatible-mode/v1', model: 'qwen-plus' },
            openai: { url: 'https://api.openai.com/v1', model: 'gpt-4o-mini' },
            gemini: { url: 'https://generativelanguage.googleapis.com/v1beta', model: 'gemini-2.0-flash-exp' },
            claude: { url: 'https://api.anthropic.com/v1', model: 'claude-3-5-sonnet-20241022' },
            glm: { url: 'https://open.bigmodel.cn/api/paas/v4', model: 'glm-4-flash' },
            grok: { url: 'https://api.x.ai/v1', model: 'grok-2-latest' },
            doubao: { url: 'https://ark.cn-beijing.volces.com/api/v3', model: 'doubao-pro-32k' }
        };

        // Provider切换
        document.getElementById('provider').addEventListener('change', (e) => {
            const config = providerConfigs[e.target.value];
            document.getElementById('apiUrl').value = config.url;
            document.getElementById('model').value = config.model;
        });

        // 发送消息
        document.getElementById('sendBtn').addEventListener('click', sendMessage);
        document.getElementById('userInput').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') sendMessage();
        });

        async function sendMessage() {
            const userInput = document.getElementById('userInput');
            const message = userInput.value.trim();
            
            if (!message) return;

            // 获取配置
            const config = {
                provider: document.getElementById('provider').value,
                apiUrl: document.getElementById('apiUrl').value,
                apiKey: document.getElementById('apiKey').value,
                model: document.getElementById('model').value,
                temperature: parseFloat(document.getElementById('temperature').value),
                name: document.getElementById('aiName').value
            };

            if (!config.apiKey) {
                showStatus('请先填写API Key', 'error');
                return;
            }

            // 显示用户消息
            addMessage('user', '你', message);
            userInput.value = '';

            // 禁用按钮
            document.getElementById('sendBtn').disabled = true;
            showStatus('AI思考中...', 'loading');

            try {
                // 调用服务器API
                const response = await fetch(`http://localhost:8889`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        type: 'test_chat',
                        config: config,
                        message: message
                    })
                });

                // 实际实现：直接通过WebSocket
                // 这里使用简单的fetch模拟
                const result = await callAI(config, message);
                
                if (result.success) {
                    addMessage('ai', config.name, result.message);
                    showStatus('✓ 发送成功', 'ready');
                } else {
                    addMessage('system', '系统', `错误: ${result.error}`);
                    showStatus('✗ 调用失败', 'error');
                }

            } catch (error) {
                addMessage('system', '系统', `错误: ${error.message}`);
                showStatus('✗ 网络错误', 'error');
            } finally {
                document.getElementById('sendBtn').disabled = false;
            }
        }

        // 调用AI API
        async function callAI(config, userMessage) {
            try {
                const messages = [
                    {
                        role: 'system',
                        content: `你是${config.name}，三国时期的著名人物。请用简短有趣的方式回应，符合你的人物性格。回复不超过50字。`
                    },
                    {
                        role: 'user',
                        content: userMessage
                    }
                ];

                const headers = {
                    'Content-Type': 'application/json',
                };

                // 根据Provider设置认证
                if (['deepseek', 'openai', 'qwen', 'grok', 'glm', 'doubao'].includes(config.provider)) {
                    headers['Authorization'] = `Bearer ${config.apiKey}`;
                } else if (config.provider === 'claude') {
                    headers['x-api-key'] = config.apiKey;
                    headers['anthropic-version'] = '2023-06-01';
                }

                let apiUrl = config.apiUrl;
                let body = {
                    model: config.model,
                    messages: messages,
                    temperature: config.temperature,
                    max_tokens: 200
                };

                if (config.provider === 'gemini') {
                    apiUrl = `${config.apiUrl}/models/${config.model}:generateContent?key=${config.apiKey}`;
                    body = {
                        contents: messages.map(m => ({
                            parts: [{ text: m.content }],
                            role: m.role === 'user' ? 'user' : 'model'
                        }))
                    };
                } else if (config.provider === 'claude') {
                    apiUrl = `${config.apiUrl}/messages`;
                    body.system = messages[0].content;
                    body.messages = messages.slice(1);
                    body.max_tokens = 200;
                } else {
                    apiUrl = `${config.apiUrl}/chat/completions`;
                }

                const response = await fetch(apiUrl, {
                    method: 'POST',
                    headers: headers,
                    body: JSON.stringify(body)
                });

                if (!response.ok) {
                    const errorText = await response.text();
                    throw new Error(`API调用失败: ${response.status} - ${errorText}`);
                }

                const result = await response.json();
                
                let aiMessage;
                if (config.provider === 'gemini') {
                    aiMessage = result.candidates[0].content.parts[0].text;
                } else if (config.provider === 'claude') {
                    aiMessage = result.content[0].text;
                } else {
                    aiMessage = result.choices[0].message.content;
                }

                return { success: true, message: aiMessage };

            } catch (error) {
                return { success: false, error: error.message };
            }
        }

        // 添加消息到聊天框
        function addMessage(type, sender, text) {
            const chatBox = document.getElementById('chatBox');
            const msgDiv = document.createElement('div');
            msgDiv.className = `chat-message ${type}`;
            msgDiv.innerHTML = `
                <div class="message-sender ${type}">${sender}</div>
                <div class="message-text">${text}</div>
            `;
            chatBox.appendChild(msgDiv);
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        // 显示状态
        function showStatus(text, type) {
            const indicator = document.getElementById('statusIndicator');
            indicator.textContent = text;
            indicator.className = `status-indicator ${type}`;
            indicator.style.display = 'block';
            setTimeout(() => {
                indicator.style.display = 'none';
            }, 3000);
        }
    </script>
    <script src="js/global_settings.js?v=20260803c"></script>
</body>
</html>
