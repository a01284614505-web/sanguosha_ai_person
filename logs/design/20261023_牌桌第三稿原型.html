<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>三国杀酒馆 · 牌桌第三稿（可互动）</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&family=Noto+Serif+SC:wght@400;600;900&display=swap">
<style>
:root{
  --gold:#f1cf78;--gold-hi:#ffd77a;--ink:#1c1105;--paper:#f6ecd2;--text:#f1e6cf;--dim:#d9c49a;
  --font:"Noto Serif SC","Songti SC","STSong","SimSun",serif;--brush:"Ma Shan Zheng","STKaiti","KaiTi",serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#0b0705;color:var(--text);font-family:var(--font)}
button{font-family:var(--font)}
/* ---------- 顶部切换栏（只是演示用，不属于游戏界面） ---------- */
#toolbar{position:fixed;left:0;right:0;top:0;height:46px;z-index:100;display:flex;align-items:center;gap:8px;padding:0 12px;background:#120c08;border-bottom:1px solid rgba(241,207,120,.3);font-size:13px;overflow-x:auto;white-space:nowrap}
#toolbar .grp{display:flex;gap:4px;align-items:center}
#toolbar .grp span{color:var(--dim);margin-right:2px}
.tb{height:30px;padding:0 12px;border:none;border-radius:15px;cursor:pointer;color:#e9dcc0;background:#2a1c10;box-shadow:inset 0 0 0 1px rgba(241,207,120,.35);font-size:13px}
.tb.on{color:#2a1906;background:linear-gradient(180deg,#fff0b6,#e0aa44)}
#hint{color:#9fd8ff;font-size:12px;margin-left:8px}
#viewport{position:fixed;left:0;right:0;top:46px;bottom:0;overflow:hidden;display:flex;align-items:center;justify-content:center}
#viewport.scroll{overflow:auto;align-items:flex-start}
.stage{position:relative;transform-origin:0 0;flex:none;overflow:hidden}
/* ---------- 鎏金边框 + 角花 ---------- */
.gf{position:relative;padding:3px;border-radius:9px;background:linear-gradient(145deg,#fff0b0 0%,#c9952e 16%,#6e4512 32%,#f7dc8a 50%,#94631f 68%,#ffe9a6 84%,#7c4f18 100%);box-shadow:0 0 0 1px var(--ink),0 12px 26px rgba(0,0,0,.62)}
.gf.act{box-shadow:0 0 0 1px var(--ink),0 0 0 5px rgba(255,214,120,.28),0 0 40px 12px rgba(255,186,84,.42),0 16px 30px rgba(0,0,0,.65)}
.gf .in{position:relative;overflow:hidden;border-radius:7px;width:100%;height:100%;box-shadow:inset 0 0 0 1px rgba(28,17,5,.95)}
.cn{position:absolute;width:24px;height:24px;z-index:4;pointer-events:none}
.cn.tl{left:-7px;top:-7px}.cn.tr{right:-7px;top:-7px;transform:scaleX(-1)}.cn.bl{left:-7px;bottom:-7px;transform:scaleY(-1)}.cn.br{right:-7px;bottom:-7px;transform:scale(-1,-1)}
.sm .cn{width:16px;height:16px}.sm .cn.tl{left:-5px;top:-5px}.sm .cn.tr{right:-5px;top:-5px}.sm .cn.bl{left:-5px;bottom:-5px}.sm .cn.br{right:-5px;bottom:-5px}
/* ---------- 座位 ---------- */
.seat{position:absolute}
.por{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 16%}
.por-shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(255,240,200,.08) 0%,rgba(0,0,0,0) 30%,rgba(0,0,0,0) 58%,rgba(12,6,2,.86) 100%)}
.fseal,.idseal{position:absolute;top:6px;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-size:13px;font-weight:900;z-index:2;box-shadow:0 0 0 1.5px var(--gold),0 0 0 3px rgba(28,17,5,.8)}
.fseal{left:6px;color:#fff6dc}.idseal{right:6px}
.sm .fseal,.sm .idseal{width:18px;height:18px;font-size:10px;top:4px;box-shadow:0 0 0 1px var(--gold)}
.sm .fseal{left:4px}.sm .idseal{right:4px}
.id-lord{background:radial-gradient(circle at 40% 35%,#fff0b6,#d29c34 60%,#7a5212);color:#3a2405}
.id-loyal{background:radial-gradient(circle at 40% 35%,#ffe6a6,#c79a3c 60%,#6e4c12);color:#3a2405}
.id-unk{background:radial-gradient(circle at 40% 35%,#5d554a,#2e2924);color:#d8cdb6}
.gycol{position:absolute;right:5px;bottom:34px;display:flex;flex-direction:column-reverse;gap:1px;padding:4px 3px;border-radius:9px;background:rgba(10,6,3,.55);z-index:2}
.sm .gycol{right:3px;bottom:22px;padding:2px;border-radius:6px}
.gy{display:block;width:15px;height:15px;filter:drop-shadow(0 1px 1px rgba(0,0,0,.8))}
.sm .gy{width:10px;height:10px}
.gy.breaking{animation:gybreak .9s ease-out forwards}
@keyframes gybreak{0%{transform:scale(1)}25%{transform:scale(1.6);filter:brightness(3) drop-shadow(0 0 6px #fff)}100%{transform:scale(1)}}
.plate{position:absolute;left:0;right:0;bottom:0;height:30px;display:flex;align-items:center;justify-content:space-between;padding:0 8px 0 10px;z-index:2;background:linear-gradient(180deg,rgba(40,22,8,0),rgba(40,22,8,.78) 40%);border-top:1px solid rgba(241,207,120,.45)}
.sm .plate{height:19px;padding:0 4px 0 5px}
.hn{font-size:17px;font-weight:900;letter-spacing:2px;color:#fff1cc;text-shadow:0 1px 0 #000,0 0 8px rgba(0,0,0,.8)}
.sm .hn{font-size:12px;letter-spacing:1px}
/* 手牌数：灰色牌背 + 数字，不高亮、不加金边 */
.hc{position:relative;width:18px;height:24px;border-radius:3px;display:grid;place-items:center;font-size:12px;font-weight:900;color:#f3ede2;background:repeating-linear-gradient(45deg,#6b665f 0 3px,#59544e 3px 6px);box-shadow:0 0 0 1px #2a2622,0 2px 4px rgba(0,0,0,.6);text-shadow:0 1px 1px #000}
.sm .hc{width:13px;height:17px;font-size:10px;border-radius:2px}
/* 判定区标记：正菱形 */
.judge{position:absolute;left:10px;top:42px;display:flex;flex-direction:column;gap:12px;z-index:3}
.sm .judge{left:6px;top:28px;gap:9px}
.jm{position:relative;width:20px;height:20px;transform:rotate(45deg);border-radius:3px;display:grid;place-items:center;cursor:context-menu}
.sm .jm{width:14px;height:14px;border-radius:2px}
.jm > *{transform:rotate(-45deg)}
.jm b{font-size:13px;font-weight:900;color:#fff;text-shadow:0 0 4px rgba(0,0,0,.6)}
.sm .jm b{font-size:9px}
.jm.thunder{background:linear-gradient(135deg,#8f80ff,#4a2aa8 60%,#2a145e);box-shadow:0 0 0 1.5px #d9d0ff,0 0 10px 2px rgba(150,130,255,.75);animation:zap 1.4s infinite}
.jm.thunder::before{content:"";position:absolute;inset:-5px;border-radius:5px;border:1.5px dashed rgba(210,200,255,.85);animation:spin 2.4s linear infinite}
.jm.thunder svg{width:14px;height:14px;filter:drop-shadow(0 0 3px #fff) drop-shadow(0 0 6px #cfc4ff)}
.sm .jm.thunder svg{width:10px;height:10px}
.sm .jm.thunder::before{inset:-3px}
@keyframes zap{0%,100%{box-shadow:0 0 0 1.5px #d9d0ff,0 0 8px 2px rgba(150,130,255,.6)}45%{box-shadow:0 0 0 1.5px #fff,0 0 16px 5px rgba(190,175,255,.95)}50%{box-shadow:0 0 0 1.5px #d9d0ff,0 0 6px 1px rgba(150,130,255,.5)}55%{box-shadow:0 0 0 1.5px #fff,0 0 18px 6px rgba(210,200,255,1)}}
@keyframes spin{to{transform:rotate(360deg)}}
.jm.lebu{background:linear-gradient(135deg,#ffb3d6,#d24b8c 60%,#7e1f4f);box-shadow:0 0 0 1.5px #ffe0ef,0 0 10px 2px rgba(255,140,200,.6);animation:pinkpulse 2.2s infinite}
@keyframes pinkpulse{50%{box-shadow:0 0 0 1.5px #fff,0 0 16px 4px rgba(255,150,210,.85)}}
.jm.bing{background:linear-gradient(135deg,#c9b77a,#7a6a2a 60%,#3e3410);box-shadow:0 0 0 1.5px #f4e6b8,0 0 8px 2px rgba(220,200,120,.5)}
/* 真铁索 */
.chain{position:absolute;left:-4px;right:-4px;top:44%;z-index:3;pointer-events:none}
.chain svg{display:block;width:100%;filter:drop-shadow(0 2px 2px rgba(0,0,0,.8))}
.nm{margin-top:8px;height:24px;border-radius:12px;display:flex;align-items:center;justify-content:center;gap:6px;font-size:12px;white-space:nowrap;background:linear-gradient(180deg,rgba(30,18,8,.86),rgba(14,8,3,.9));box-shadow:inset 0 0 0 1px rgba(241,207,120,.45)}
.nm b{color:var(--gold-hi)}
.eqs{margin-top:5px;display:flex;flex-wrap:wrap;gap:4px;justify-content:center}
.eq{font-size:11px;padding:2px 7px;border-radius:3px;color:#f3e2bd;background:linear-gradient(180deg,#3a2a18,#21160c);box-shadow:inset 0 0 0 1px rgba(241,207,120,.4);cursor:context-menu}
.plaque-row{height:24px;display:flex;justify-content:center;align-items:flex-end;margin-bottom:5px}
.ttl{font-size:12px;font-weight:900;letter-spacing:2px;color:#3a2405;padding:2px 12px;border-radius:2px;background:linear-gradient(180deg,#fff2bf,#e2b24c 55%,#a8761f);box-shadow:0 0 0 1px #4a2e08,0 0 10px rgba(255,200,90,.5)}
.sm .ttl{font-size:9px;padding:1px 6px;letter-spacing:1px}
.ttl.hi{background:linear-gradient(100deg,#ffe7a0 0%,#fff8d8 30%,#e0a83c 52%,#fff2bf 74%,#c88a22 100%);background-size:200% 100%;animation:sheen 3s linear infinite}
@keyframes sheen{to{background-position:-200% 0}}
.ribbon{position:absolute;left:50%;top:9px;transform:translateX(-50%);z-index:5;font-size:11px;font-weight:900;letter-spacing:2px;color:#fff3d2;padding:2px 10px;white-space:nowrap;background:linear-gradient(180deg,#c43a24,#7a1a0e);box-shadow:0 0 0 1px var(--gold);clip-path:polygon(6% 0,94% 0,100% 50%,94% 100%,6% 100%,0 50%)}
.sm .ribbon{font-size:8px;padding:1px 6px;top:6px;letter-spacing:0}
.shake{animation:shake .5s}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-7px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(3px)}}
.hurt-flash{position:absolute;inset:0;z-index:6;background:radial-gradient(circle,rgba(255,60,30,.55),rgba(255,30,10,0) 70%);animation:fadeout .8s forwards;pointer-events:none}
@keyframes fadeout{to{opacity:0}}
.dmg-num{position:absolute;left:50%;top:30%;z-index:7;font-family:var(--brush);font-size:56px;color:#ff5a3a;text-shadow:0 0 12px rgba(255,60,30,.9),0 3px 0 #2a0800;transform:translateX(-50%);animation:floatup 1.2s forwards;pointer-events:none}
@keyframes floatup{0%{opacity:0;transform:translate(-50%,10px) scale(.6)}20%{opacity:1;transform:translate(-50%,0) scale(1.2)}100%{opacity:0;transform:translate(-50%,-50px) scale(1)}}
/* 头顶对话框：白色调，指向对应角色 */
.bubble{position:absolute;z-index:20;max-width:220px;padding:6px 11px;border-radius:10px;font-size:13px;line-height:1.5;color:#2a1d10;background:linear-gradient(180deg,#fffaf0,#f1e4c4);box-shadow:0 0 0 1px #8a6b3a,0 6px 14px rgba(0,0,0,.5);animation:pop .25s ease-out;white-space:normal;pointer-events:none}
.bubble::after{content:"";position:absolute;left:50%;bottom:-7px;margin-left:-7px;border:7px solid transparent;border-bottom:0;border-top-color:#f1e4c4;filter:drop-shadow(0 1px 0 #8a6b3a)}
.bubble.below::after{bottom:auto;top:-7px;border:7px solid transparent;border-top:0;border-bottom-color:#fffaf0}
.sm .bubble,.bubble.sm{font-size:11px;padding:4px 8px;max-width:150px}
@keyframes pop{from{opacity:0;transform:translateY(6px) scale(.9)}}
/* ---------- 卡牌：牌名竖排在左侧，叠放时露出的窄条就能看清，彻底避免压字 ---------- */
.cd{--w:92px;position:absolute;width:var(--w);height:calc(var(--w)*1.4);border-radius:calc(var(--w)*.075);overflow:hidden;background:radial-gradient(ellipse at 55% 45%,rgba(255,252,240,.8),rgba(255,252,240,0) 70%),linear-gradient(180deg,#f7eed6,#e2cd9f);border:1px solid #6d4f22;box-shadow:inset 0 0 0 2px rgba(255,255,255,.5),inset 0 0 0 3px rgba(150,110,50,.4),0 8px 16px rgba(0,0,0,.6);color:#2a1d10;transition:transform .18s ease,top .18s ease,filter .18s,box-shadow .18s;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.cd::before{content:"";position:absolute;inset:calc(var(--w)*.05);border:1px solid rgba(160,118,48,.55);border-radius:calc(var(--w)*.04);pointer-events:none}
.cd .art{position:absolute;left:28%;top:16%;width:64%;height:56%;object-fit:contain;mix-blend-mode:multiply;opacity:.95;pointer-events:none}
.cd .corner{position:absolute;left:calc(var(--w)*.06);top:calc(var(--w)*.05);width:calc(var(--w)*.2);display:flex;flex-direction:column;align-items:center;font:700 calc(var(--w)*.16)/1 Georgia,"Times New Roman",serif;z-index:2}
.cd .corner .s{font-size:calc(var(--w)*.17);margin-top:1px}
.cd .red{color:#a8261c}.cd .black{color:#1b1612}
.cd .vname{position:absolute;left:calc(var(--w)*.06);top:calc(var(--w)*.42);width:calc(var(--w)*.2);writing-mode:vertical-rl;text-orientation:upright;display:flex;align-items:center;font-size:calc(var(--w)*.15);font-weight:900;letter-spacing:1px;line-height:1;z-index:2}
.cd .vname.long{font-size:calc(var(--w)*.13);letter-spacing:0}
.cd .tag{position:absolute;right:calc(var(--w)*.05);top:calc(var(--w)*.05);writing-mode:vertical-rl;font-size:calc(var(--w)*.11);font-weight:600;padding:3px 2px;border-radius:2px;color:#f6ead0;z-index:2}
.t-trick{background:#6a4a2a}.t-equip{background:#46535d}.t-delay{background:#5d3a52}
.cd.dim{filter:brightness(.6) saturate(.55)}
.cd.sel{transform:translateY(-26px) scale(1.06);box-shadow:inset 0 0 0 2px rgba(255,255,255,.5),0 0 0 2px #ffe08a,0 0 22px 5px rgba(255,210,110,.7),0 22px 26px rgba(0,0,0,.6);filter:none}
.hand .cd{transition:transform .22s cubic-bezier(.34,1.56,.64,1),filter .18s,box-shadow .18s}
.hand .cd:not(.sel):hover{transform:translateY(-6px)}
.sm .hand .cd.sel{transform:translateY(-20px) scale(1.06)}
.cd.nudge{animation:nudge .3s}
@keyframes nudge{25%{margin-left:-4px}75%{margin-left:4px}}
.cd.old{filter:brightness(.72) saturate(.75)}
.cd.hot{box-shadow:inset 0 0 0 2px rgba(255,255,255,.5),0 0 0 2px #ffb070,0 0 34px 8px rgba(255,96,50,.55),0 16px 28px rgba(0,0,0,.65)}
.cd.cancelled{filter:grayscale(.7) brightness(.6)}
.cd .stampx{position:absolute;inset:0;display:grid;place-items:center;z-index:3;font-family:var(--brush);font-size:calc(var(--w)*.36);color:#e8402c;transform:rotate(-16deg);text-shadow:0 0 4px rgba(255,255,255,.6)}
.cd.fly{animation:flyin .45s cubic-bezier(.2,.8,.2,1)}
@keyframes flyin{from{opacity:0;transform:translate(60px,160px) scale(.7) rotate(0)}}
.hand .cd{cursor:pointer}
.namepop{position:absolute;z-index:30;transform:translateX(-50%);white-space:nowrap;font-size:13px;font-weight:900;padding:3px 10px;border-radius:4px;color:#2a1d10;background:#fffaf0;box-shadow:0 0 0 1px #8a6b3a,0 4px 10px rgba(0,0,0,.5);pointer-events:none}
.namepop::after{content:"";position:absolute;left:50%;bottom:-6px;margin-left:-6px;border:6px solid transparent;border-bottom:0;border-top-color:#fffaf0}
.cap{position:absolute;font-size:12px;white-space:nowrap;color:#f6e7c4;padding:3px 10px;border-radius:10px;background:rgba(14,8,3,.8);box-shadow:inset 0 0 0 1px rgba(241,207,120,.45)}
/* ---------- 底部区域 ---------- */
.bar-rule{position:absolute;left:0;height:3px;background:linear-gradient(90deg,rgba(241,207,120,0),var(--gold) 18%,#fff2bf 50%,var(--gold) 82%,rgba(241,207,120,0))}
.sec{font-size:13px;font-weight:900;letter-spacing:3px;color:var(--gold);display:flex;align-items:center;gap:8px}
.sec::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,rgba(241,207,120,.6),rgba(241,207,120,0))}
.slot{height:30px;border-radius:4px;display:flex;align-items:center;gap:8px;padding:0 8px;font-size:13px;background:linear-gradient(180deg,rgba(54,36,18,.75),rgba(26,16,8,.85));box-shadow:inset 0 0 0 1px rgba(241,207,120,.35);white-space:nowrap;overflow:hidden;cursor:context-menu}
.slot.empty{opacity:.5;cursor:default}
.slot-k{width:22px;height:20px;flex:none;border-radius:3px;display:grid;place-items:center;font-size:11px;font-weight:900;color:#3a2405;background:linear-gradient(180deg,#ffe6a0,#c9952e)}
.slot-art{width:22px;height:22px;border-radius:3px;object-fit:cover;flex:none}
.slot-sr{margin-left:auto;font-family:Georgia,serif;font-size:12px}
.sm .slot{height:24px;font-size:11px;gap:5px;padding:0 6px}
.sm .slot-k{width:17px;height:16px;font-size:9px}
.sm .slot-art{width:16px;height:16px}
.phtrack{display:flex;align-items:center;gap:12px}
.phline{position:relative;display:flex;align-items:center;gap:14px;padding:0 4px}
.phline::before{content:"";position:absolute;left:14px;right:14px;top:50%;height:2px;background:linear-gradient(90deg,#c9952e,var(--gold) 52%,rgba(241,207,120,.25) 60%)}
.ph{position:relative;z-index:1;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-size:13px;font-weight:900}
.ph-done{color:#3a2405;background:radial-gradient(circle at 40% 35%,#e9cf8a,#9b7428);opacity:.75}
.ph-now{width:40px;height:40px;font-size:18px;color:#3a2405;background:radial-gradient(circle at 40% 35%,#fff4c6,#f0b84a 55%,#a8711c);box-shadow:0 0 0 2px #fff0b8,0 0 0 4px rgba(28,17,5,.9),0 0 24px 8px rgba(255,200,90,.7)}
.ph-next{color:#e9d9b2;background:rgba(20,12,5,.85);box-shadow:inset 0 0 0 1.5px rgba(241,207,120,.6)}
.sm .phline{gap:0;justify-content:space-between;flex:1}
.sm .ph{width:22px;height:22px;font-size:11px}.sm .ph-now{width:30px;height:30px;font-size:14px}
.prompt{position:absolute;border-radius:10px;display:flex;align-items:center;gap:14px;background:linear-gradient(180deg,rgba(255,236,190,.14),rgba(255,236,190,.05)),rgba(20,12,6,.78);backdrop-filter:blur(14px) saturate(140%);-webkit-backdrop-filter:blur(14px) saturate(140%);box-shadow:0 0 0 1px var(--ink),inset 0 0 0 1px rgba(241,207,120,.55),inset 0 1px 0 rgba(255,255,255,.18),0 12px 28px rgba(0,0,0,.55);animation:pop .2s ease-out}
.pip{display:inline-block;width:11px;height:11px;border-radius:50%;box-shadow:0 0 0 1.5px var(--gold);vertical-align:middle;margin-left:4px}
.pip.on{background:radial-gradient(circle at 40% 35%,#fff4c6,#f0b84a)}
.dial{flex:none;width:46px;height:46px;border-radius:50%;display:grid;place-items:center}
.dial span{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:#1a0f06;font-size:17px;font-weight:900;color:var(--gold-hi)}
.sm .dial{width:36px;height:36px}.sm .dial span{width:28px;height:28px;font-size:14px}
.btn-ok,.btn-no{height:42px;min-width:92px;border:none;border-radius:4px;cursor:pointer;font-size:16px;letter-spacing:4px}
.btn-ok{font-weight:900;color:#2a1906;background:linear-gradient(180deg,#fff0b6,#e0aa44 55%,#a8711c);box-shadow:0 0 0 1px #4a2e08,inset 0 1px 0 rgba(255,255,255,.7),0 6px 14px rgba(0,0,0,.45)}
.btn-ok:disabled{filter:grayscale(.8) brightness(.6);cursor:not-allowed}
.btn-no{color:#ecdcb8;background:linear-gradient(180deg,#4a3420,#24170c);box-shadow:0 0 0 1px var(--ink),inset 0 0 0 1px rgba(241,207,120,.45)}
.sm .btn-ok,.sm .btn-no{height:38px;min-width:58px;font-size:14px;letter-spacing:2px}
/* 技能长条：统一金色（电脑与手机相同） */
.sk{position:relative;height:32px;border:none;border-radius:4px;cursor:pointer;display:flex;align-items:center;gap:8px;padding:0 10px;white-space:nowrap}
.sk b{font-size:16px;font-weight:900;letter-spacing:4px}
.sk i{margin-left:auto;font-style:normal;font-size:11px;opacity:.85}
.sk .gem{width:10px;height:10px;flex:none;transform:rotate(45deg)}
.sk-ready{color:#fff1c4;background:linear-gradient(180deg,#8a3420,#4e180c);box-shadow:0 0 0 2px var(--gold),0 0 0 4px var(--ink),0 0 18px 4px rgba(255,200,90,.55);animation:skglow 1.6s infinite}
.sk-ready .gem{background:var(--gold);box-shadow:0 0 6px #ffd77a}
@keyframes skglow{50%{box-shadow:0 0 0 2px #fff0b8,0 0 0 4px var(--ink),0 0 26px 8px rgba(255,200,90,.75)}}
.sk-idle{color:#e6d6b2;background:linear-gradient(180deg,#4a2c1a,#2a170c);box-shadow:0 0 0 2px #a8813e,0 0 0 4px var(--ink)}
.sk-idle .gem{background:#a8813e}
.sk-off{color:#9c8f78;background:linear-gradient(180deg,#2e2820,#1a1612);box-shadow:0 0 0 2px #6d5a3a,0 0 0 4px var(--ink);cursor:not-allowed}
.sk-off .gem{background:#6d5a3a}
.sk-on{color:#3a2405;background:linear-gradient(180deg,#fff0b6,#e0aa44 55%,#a8711c);box-shadow:0 0 0 2px #fff4c6,0 0 0 4px var(--ink),inset 0 2px 6px rgba(0,0,0,.35)}
.sk-on .gem{background:#7a1a10}
.sk-used{color:#7d725f;background:linear-gradient(180deg,#26211b,#15120e);box-shadow:0 0 0 2px #4d4130,0 0 0 4px var(--ink);text-decoration:line-through;cursor:not-allowed}
.sk-used .gem{background:#4d4130}
.sm .sk{height:30px;padding:0 8px;gap:6px}.sm .sk b{font-size:14px;letter-spacing:2px}.sm .sk i{font-size:10px}
/* 技能大字 */
.shout-wrap{position:absolute;z-index:25;pointer-events:none;animation:shoutin 1.6s ease-out forwards}
@keyframes shoutin{0%{opacity:0;transform:scale(1.6)}15%{opacity:1;transform:scale(1)}80%{opacity:1}100%{opacity:0}}
.shout-wrap.stay{animation:shoutstay .6s ease-out forwards}
@keyframes shoutstay{0%{opacity:0;transform:scale(1.6)}100%{opacity:1;transform:scale(1)}}
.shout{font-family:var(--brush);background:linear-gradient(180deg,#fff6d6,#f0c75e 52%,#a8711c);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 3px 0 rgba(40,20,4,.8)) drop-shadow(0 0 16px rgba(255,190,80,.6));line-height:1;text-align:center}
.badge{position:absolute;transform:rotate(45deg);overflow:hidden;box-shadow:0 0 0 3px var(--gold),0 0 0 5px var(--ink),0 0 24px 6px rgba(255,200,90,.7)}
.badge img{position:absolute;object-fit:cover;object-position:50% 12%;transform:rotate(-45deg)}
/* ---------- 侧边席间 ---------- */
.tab{flex:1;height:44px;border:none;background:none;cursor:pointer;font-size:16px;font-weight:900;letter-spacing:6px;color:#a8977a;position:relative}
.tab.on{color:var(--gold-hi)}
.tab.on::after{content:"";position:absolute;left:24%;right:24%;bottom:0;height:3px;background:linear-gradient(90deg,rgba(241,207,120,0),var(--gold),rgba(241,207,120,0))}
.msgs{flex:1;overflow-y:auto;padding:14px 14px 8px;display:flex;flex-direction:column;gap:12px}
.msg{display:flex;gap:8px;align-items:flex-start}
.msg.me{flex-direction:row-reverse}
.ava{width:30px;height:30px;border-radius:50%;object-fit:cover;object-position:50% 15%;flex:none;box-shadow:0 0 0 1.5px var(--gold)}
.who{font-size:11px;color:#d9b866;margin-bottom:2px}
.msg.me .who{text-align:right}
.bub{max-width:196px;font-size:13px;line-height:1.55;padding:6px 10px;border-radius:2px 10px 10px 10px;background:linear-gradient(180deg,#3a2a18,#261a0e);box-shadow:inset 0 0 0 1px rgba(241,207,120,.3)}
.msg.me .bub{border-radius:10px 2px 10px 10px;background:linear-gradient(180deg,#6a2a1a,#45180e)}
.ts{font-size:10px;color:#8f8068;margin-top:3px;font-family:Georgia,serif}
.msg.me .ts{text-align:right}
.logline{font-size:12px;line-height:1.6;color:#e2d2b0}
.logline .ts{display:inline;margin-right:6px}
.chip{border:none;cursor:pointer;font-size:12px;color:#ecdcb8;padding:5px 10px;border-radius:12px;background:linear-gradient(180deg,#3a2a18,#21160c);box-shadow:inset 0 0 0 1px rgba(241,207,120,.4)}
.chatin{flex:1;min-width:0;height:38px;padding:0 12px;border-radius:4px;border:none;font-family:var(--font);font-size:14px;color:var(--text);background:rgba(10,6,3,.6);box-shadow:inset 0 0 0 1px rgba(241,207,120,.45);outline:none}
.iconbtn{width:40px;height:40px;border:none;border-radius:50%;cursor:pointer;display:grid;place-items:center;color:#ffe7a6;background:radial-gradient(circle at 40% 35%,#4a3420,#1c1208);box-shadow:0 0 0 2px #c9952e,0 0 0 3px var(--ink),0 4px 10px rgba(0,0,0,.5)}
.pillbtn{height:40px;border:none;border-radius:20px;cursor:pointer;padding:0 18px;font-size:15px;font-weight:900;letter-spacing:3px;color:#ffe7a6;background:radial-gradient(circle at 40% 35%,#4a3420,#1c1208);box-shadow:0 0 0 2px #c9952e,0 0 0 3px var(--ink),0 4px 10px rgba(0,0,0,.5)}
.sm .iconbtn{width:34px;height:34px;box-shadow:0 0 0 1.5px #c9952e,0 0 0 2.5px var(--ink)}
.sm .pillbtn{height:34px;padding:0 12px;font-size:13px;letter-spacing:1px}
/* ---------- 牌的完整说明（右键 / 长按） ---------- */
#info{position:fixed;z-index:200;display:none;width:216px;padding:9px 11px 10px;border-radius:8px;background:linear-gradient(180deg,rgba(255,236,190,.12),rgba(255,236,190,.03)),rgba(20,12,6,.94);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);box-shadow:0 0 0 1px var(--ink),inset 0 0 0 1px rgba(241,207,120,.6),0 10px 24px rgba(0,0,0,.6);animation:pop .15s ease-out;pointer-events:none}
#info.show{display:block}
#info .hd{display:flex;align-items:center;gap:8px;margin-bottom:5px}
#info .hd img{width:34px;height:34px;border-radius:4px;object-fit:cover;background:#efe2c2;flex:none}
#info h3{margin:0;font-size:15px;color:var(--gold-hi);letter-spacing:1px;line-height:1.2}
#info .meta{font-size:11px;color:#c9b48a}
#info p{margin:0;font-size:12px;line-height:1.55}
#toast{position:fixed;left:50%;top:60px;z-index:150;transform:translateX(-50%);padding:8px 16px;border-radius:6px;font-size:13px;color:#2a1d10;background:#fffaf0;box-shadow:0 0 0 1px #8a6b3a,0 8px 20px rgba(0,0,0,.5);display:none;max-width:90vw}
#toast.show{display:block;animation:pop .2s}
/* ---------- 手机端席间抽屉 ---------- */
.drawer{position:absolute;left:0;right:0;bottom:0;height:62%;z-index:60;display:flex;flex-direction:column;border-radius:14px 14px 0 0;box-shadow:0 -2px 0 var(--gold),0 -10px 30px rgba(0,0,0,.6);animation:slideup .22s ease-out}
@keyframes slideup{from{transform:translateY(100%)}}
/* ---------- 组件说明页 ---------- */
.spec{width:1200px;margin:24px auto 60px;display:flex;flex-direction:column;gap:22px}
.box{border-radius:8px;padding:18px 20px;background:linear-gradient(180deg,rgba(40,26,16,.9),rgba(24,15,9,.95));box-shadow:0 0 0 1px var(--ink),inset 0 0 0 1px rgba(241,207,120,.35)}
.h2{font-size:20px;font-weight:900;letter-spacing:4px;color:var(--gold-hi);display:flex;align-items:center;gap:12px;margin-bottom:14px}
.h2::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,rgba(241,207,120,.6),rgba(241,207,120,0))}
.note{font-size:13px;line-height:1.75;color:var(--dim)}
.note b{color:var(--gold-hi)}
.lbl{font-size:13px;text-align:center;margin-top:8px}
.row{display:flex;gap:26px;flex-wrap:wrap;align-items:flex-end}
.stampbig{position:absolute;left:14px;top:42px;z-index:3;font-family:var(--brush);font-size:28px;line-height:1.05;text-align:center;color:#e8402c;border:3px solid #e8402c;border-radius:5px;padding:4px 6px;transform:rotate(-14deg);background:rgba(30,6,4,.3)}
.dead .por{filter:grayscale(1) brightness(.5)}
.gf.dying{box-shadow:0 0 0 1px var(--ink),0 0 0 5px rgba(255,80,60,.35),0 0 34px 10px rgba(255,60,40,.5);animation:dying 1.2s infinite}
@keyframes dying{50%{box-shadow:0 0 0 1px var(--ink),0 0 0 5px rgba(255,80,60,.5),0 0 44px 16px rgba(255,60,40,.7)}}
.askpeach{position:absolute;left:0;right:0;top:36%;z-index:3;text-align:center;font-family:var(--brush);font-size:28px;color:#ff6a50;text-shadow:0 0 14px rgba(255,60,40,.9)}
.storyboard{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px}
.step{border-radius:8px;padding:12px;display:flex;flex-direction:column;gap:8px;background:rgba(14,9,5,.75);box-shadow:inset 0 0 0 1px rgba(241,207,120,.35)}
.num{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-size:13px;font-weight:900;color:#3a2405;background:radial-gradient(circle at 40% 35%,#fff4c6,#f0b84a 60%,#a8711c)}
.mini{font-size:12px;line-height:1.55;padding:8px 10px;border-radius:6px;background:rgba(40,26,14,.9);box-shadow:inset 0 0 0 1px rgba(241,207,120,.55)}
</style>
</head>

function gouyu(n, max, cls) {
  const r = n / max;
  const fill = r > 0.66 ? 'url(#gyG)' : (r > 0.34 ? 'url(#gyY)' : 'url(#gyR)');
  let out = '';
  for (let i = 0; i < max; i++) {
    const c = (cls && cls[i]) || '';
    out += '<svg class="gy ' + c + '" viewBox="0 0 12 12" aria-hidden="true"><path d="M6 .4A5.6 5.6 0 0 1 6 11.6A2.8 2.8 0 0 1 6 6A2.8 2.8 0 0 0 6 .4Z" fill="' + (i < n ? fill : '#3b342e') + '" stroke="rgba(0,0,0,.6)" stroke-width=".8"/><circle cx="6" cy="8.8" r="1" fill="rgba(0,0,0,.45)"/></svg>';
  }
  return '<div class="gycol">' + out + '</div>';
}
const CORNER = '<path d="M3 22V10a7 7 0 0 1 7-7h12" fill="none" stroke="#1c1105" stroke-width="4.4"/><path d="M3 22V10a7 7 0 0 1 7-7h12" fill="none" stroke="#f1cf78" stroke-width="2"/><path d="M7.6 15.6c-2.4 0-3.7-1.6-3.7-3.4s1.4-3.2 3.1-3.2 2.7 1.2 2.7 2.6-1 2.2-2.1 2.2" fill="none" stroke="#f1cf78" stroke-width="1.5"/><circle cx="22" cy="3" r="1.9" fill="#f1cf78"/><circle cx="3" cy="22" r="1.9" fill="#f1cf78"/>';
const corners = () => ['tl', 'tr', 'bl', 'br'].map((k) => '<svg class="cn ' + k + '" viewBox="0 0 24 24" aria-hidden="true">' + CORNER + '</svg>').join('');
function chainSVG(w) {
  const n = Math.ceil(w / 15);
  let s = '';
  for (let i = 0; i < n; i++) {
    const x = i * 15;
    s += i % 2 === 0
      ? '<ellipse cx="' + (x + 7.5) + '" cy="9" rx="8.5" ry="5.6" fill="none" stroke="#1a1d22" stroke-width="5"/><ellipse cx="' + (x + 7.5) + '" cy="9" rx="8.5" ry="5.6" fill="none" stroke="url(#steel)" stroke-width="3"/>'
      : '<rect x="' + (x + 1) + '" y="6.6" width="13" height="4.8" rx="2.4" fill="#1a1d22"/><rect x="' + (x + 1.8) + '" y="7.4" width="11.4" height="3.2" rx="1.6" fill="url(#steel)"/>';
  }
  return '<div class="chain"><svg viewBox="0 0 ' + (n * 15) + ' 18" height="18" preserveAspectRatio="none" aria-hidden="true">' + s + '</svg></div>';
}

    '<div class="step"><span class="num">4</span><div class="mini">请打出第 2 张【闪】 ●○（刚摸到的牌也能用）</div></div>' +
    '<div class="step"><span class="num">5</span><div class="mini">都出：【杀】盖"抵消"。没出：受伤演出，再问"受伤后"技能（奸雄）</div></div>' +
    '</div><p class="note">在"电脑端"或"手机竖屏"里可以亲手走一遍：选一张【闪】按确定，再选第二张；或者直接按取消，看受伤和奸雄的演出。</p></div>' +
    '</div>';
}

/* ======================= 交互 ======================= */
let view = 'desk', pal = 'night', timerId = null;
function render() {
  const P = PALETTES[pal];
  const vp = $('#viewport');
  vp.classList.toggle('scroll', view === 'spec');
  vp.innerHTML = view === 'desk' ? renderDesk(P) : (view === 'mobile' ? renderMobile(P) : renderSpec());
  document.querySelectorAll('[data-view]').forEach((b) => b.classList.toggle('on', b.dataset.view === view));
  document.querySelectorAll('[data-pal]').forEach((b) => b.classList.toggle('on', b.dataset.pal === pal));
  $('#hint').textContent = view === 'desk' ? '点牌选中（牌会抬起）· 右键看说明 · 选【闪】按确定' : (view === 'mobile' ? '点牌选中 · 长按看说明 · 右上气泡打开席间' : '');
  fit();
  const m = $('#msgs');
  if (m) m.scrollTop = m.scrollHeight;
  S.pile.forEach((c) => { c.fly = false; });
  if (S.shout && S.shout.once) {
    const sh = S.shout;
    setTimeout(() => { if (S.shout === sh) { S.shout = null; } }, 1600);
  }
}
function fit() {
  const st = $('#stage');
  if (!st) return;
  const vp = $('#viewport');
  const w = st.offsetWidth, h = st.offsetHeight;
  const k = Math.min(vp.clientWidth / w, vp.clientHeight / h);
  st.style.transform = 'scale(' + k + ')';
  st.style.marginRight = (w * k - w) + 'px';
  st.style.marginBottom = (h * k - h) + 'px';
}
window.addEventListener('resize', fit);
function toast(t, ms) {
  const el = $('#toast');
  el.textContent = t;
  el.classList.add('show');
  clearTimeout(toast.t);
  toast.t = setTimeout(() => el.classList.remove('show'), ms || 2600);
}
function showInfo(name, suit, rank, anchor) {
  const info = CARD_INFO[name];
  if (!info) return;
  const box = $('#info');
  box.innerHTML = '<div class="hd"><img src="' + IMG[ART[name]] + '" alt=""><div><h3>' + esc(name) + '</h3><div class="meta">' + info[0] + (suit ? ' · ' + suit + rank : '') + '</div></div></div><p>' + info[1] + '</p>';
  box.classList.add('show');
  // 贴着被查看的牌：优先放在它正上方，放不下就放下方；左右不出屏
  const r = anchor.getBoundingClientRect();
  const w = box.offsetWidth, h = box.offsetHeight;
  let left = r.left + r.width / 2 - w / 2;
  left = Math.max(8, Math.min(window.innerWidth - w - 8, left));
  let top = r.top - h - 8;
  if (top < 52) top = Math.min(window.innerHeight - h - 8, r.bottom + 8);
  box.style.left = left + 'px';
  box.style.top = top + 'px';
}
function hideInfo() { $('#info').classList.remove('show'); }
document.addEventListener('pointerdown', (e) => { if (e.button !== 2) hideInfo(); }, true);
window.addEventListener('scroll', hideInfo, true);
function startTimer() {
  clearInterval(timerId);
  S.timer = 15;
  timerId = setInterval(() => {
    if (!stepText()) return;
    S.timer -= 1;
    document.querySelectorAll('.dial').forEach((d) => { d.setAttribute('style', dialStyle()); d.firstChild.textContent = Math.max(0, S.timer); });
    if (S.timer <= 0) clearInterval(timerId);
  }, 1000);
}
function addLog(text) { S.log.push({ ts: now(), text }); }
function say(key, text, who, img) {
  S.bubbles[key] = text;
  S.chat.push({ who, img, text, ts: now(), me: key === 'me' });
  setTimeout(() => { if (S.bubbles[key] === text) { delete S.bubbles[key]; render(); } }, 4200);
}
function playSelected() {
  const c = S.hand.find((x) => x.id === S.selected);
  if (!c) return;
  S.hand = S.hand.filter((x) => x !== c);
  S.selected = null; S.hover = null;
  const n = S.pile.length;
  const k = S.pile.findIndex((x) => x.id === 'killcard');
  const resp = S.pile.filter((x) => x.resp).length;
  const card = { ...c, x: 370 + resp * 34, y: 96 + resp * 6, r: (resp % 2 ? 9 : 4), fly: true, hot: false, resp: true };
  if (k >= 0) S.pile.splice(k, 0, card); else S.pile.push(card);
  if (S.pile.length > 7) S.pile.shift();
}
function act(a) {
  if (a === 'ok' && !canConfirm()) return;
  if (a === 'ok') {
    if (S.step === 'shan1') {
      playSelected();
      addLog('4号 你 打出【闪】（第 1 张）');
      S.step = 'between';
      render();
      toast('此处是"打出闪后"技能的询问时机：有这类技能的武将会在这里被询问是否发动；曹操没有，直接继续。', 2600);
      setTimeout(() => { S.step = 'shan2'; startTimer(); render(); }, 1400);
      return;
    }
    if (S.step === 'shan2') {
      playSelected();
      addLog('4号 你 打出【闪】（第 2 张），【杀】被抵消');
      const k = S.pile.find((x) => x.id === 'killcard');
      if (k) { k.cancelled = true; k.hot = false; }
      S.step = 'dodged';
      render();
      setTimeout(() => { say('lvbu', '……接住了？', '2号 小乔我老婆', 'h_lvbu'); render(); }, 700);
      return;
    }
  }
  if (a === 'cancel' && (S.step === 'shan1' || S.step === 'shan2')) {
    S.step = 'hurt'; S.selected = null;
    const lost = S.myHp - 1;
    S.breaking = []; S.breaking[lost] = 'breaking';
    S.effects = ['hurt'];
    render();
    const f = $('#myframe'); if (f) f.classList.add('shake');
    addLog('4号 你 受到 2号 吕布 造成的 1 点伤害');
    setTimeout(() => {
      S.myHp = lost; S.breaking = null; S.effects = [];
      S.step = 'jianxiong'; S.skillState = 'ready'; startTimer();
      render();
    }, 950);
    return;
  }
  if ((a === 'jx-yes' || a === 'skill-jx') && S.step === 'jianxiong') {
    S.skillState = 'on';
    S.shout = { key: 'me', text: '奸雄', once: true };
    render();
    setTimeout(() => {
      const k = S.pile.find((x) => x.id === 'killcard');
      S.pile = S.pile.filter((x) => x !== k);
      S.hand.push({ id: 'jx1', name: '杀', suit: '♠', rank: '7' }, { id: 'jx2', name: '桃', suit: '♥', rank: 'Q' });
      addLog('4号 你 发动【奸雄】，获得【杀】并摸一张牌');
      S.step = 'done'; S.skillState = 'idle';
      render();
      setTimeout(() => { say('me', '宁教我负天下人。', '我', 'h_caocao'); render(); }, 300);
    }, 900);
    return;
  }
  if (a === 'jx-no' && S.step === 'jianxiong') { S.step = 'done'; S.skillState = 'idle'; render(); return; }
  if (a === 'drawer') { S.drawer = !S.drawer; render(); }
}
const vpEl = $('#viewport');
vpEl.addEventListener('click', (e) => {
  if (pressFired) { pressFired = false; return; }
  const t = e.target;
  const tab = t.closest('[data-tab]');
  if (tab) { S.tab = tab.dataset.tab; render(); return; }
  const chip = t.closest('[data-chip]');
  if (chip) { sendChat(chip.dataset.chip); return; }
  const b = t.closest('[data-act]');
  if (b && !b.disabled) { act(b.dataset.act); return; }
  const card = t.closest('[data-card]');
  if (card) {
    const c = S.hand.find((x) => x.id === card.dataset.card);
    if (!c) return;
    if (playable(c)) { S.selected = S.selected === c.id ? null : c.id; render(); }
    else { card.classList.remove('nudge'); void card.offsetWidth; card.classList.add('nudge'); }
  }
});
vpEl.addEventListener('submit', (e) => {
  e.preventDefault();
  const inp = $('#chatIn');
  if (inp && inp.value.trim()) sendChat(inp.value.trim());
});
function sendChat(text) {
  say('me', text, '我', 'h_caocao');
  render();
  setTimeout(() => {
    const replies = ['嘴硬。', '忠不忠，看你接下来救不救主公。', '你上回合可没帮主公。'];
    say('lvbu', replies[Math.floor(Math.random() * replies.length)], '2号 小乔我老婆', 'h_lvbu');
    render();
  }, 1500);
}

function renderNamePopOnly() {
  const old = $('#stage .namepop');
  if (old) old.remove();
  const hv = S.hand.find((c) => c.id === S.hover);
  if (!hv) return;
  const i = S.hand.indexOf(hv);
  const n = S.hand.length;
  const step = n > 1 ? Math.min(98, (620 - 92) / (n - 1)) : 0;
  const div = document.createElement('div');
  div.className = 'namepop';
  div.style.left = (236 + Math.round(i * step) + 46) + 'px';
  div.style.top = ((S.selected === hv.id ? 752 : 770) - 34) + 'px';
  div.textContent = hv.name + ' ' + hv.suit + hv.rank;
  $('#stage').appendChild(div);
}
function infoFromTarget(t) {
  const card = t.closest('[data-card]');
  if (card) { const c = S.hand.find((x) => x.id === card.dataset.card); if (c) return [c.name, c.suit, c.rank, card]; }
  const el = t.closest('[data-info]');
  if (el) return [el.dataset.info, el.dataset.suit || '', el.dataset.rank || '', el];
  return null;
}
vpEl.addEventListener('contextmenu', (e) => {
  const inf = infoFromTarget(e.target);
  if (!inf) return;
  e.preventDefault();
  showInfo(...inf);
});
let pressTimer = null, pressFired = false;
vpEl.addEventListener('touchstart', (e) => {
  const inf = infoFromTarget(e.target);
  if (!inf) return;
  pressTimer = setTimeout(() => { pressFired = true; showInfo(...inf); }, 500);
}, { passive: true });
['touchend', 'touchmove', 'touchcancel'].forEach((ev) => vpEl.addEventListener(ev, () => clearTimeout(pressTimer), { passive: true }));

document.querySelectorAll('[data-view]').forEach((b) => b.addEventListener('click', () => { view = b.dataset.view; S.drawer = false; render(); }));
document.querySelectorAll('[data-pal]').forEach((b) => b.addEventListener('click', () => { pal = b.dataset.pal; render(); }));
$('#resetBtn').addEventListener('click', () => { reset(); startTimer(); render(); });

reset();
view = window.innerWidth < 700 ? 'mobile' : 'desk';
startTimer();
render();
setTimeout(() => { if (S.bubbles.lvbu) { delete S.bubbles.lvbu; render(); } }, 5000);
</script>
</body>
